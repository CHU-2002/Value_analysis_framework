name: CI

on:
  # 子 PR 的目标是特性分支（feat/*），所以 PR 不做分支过滤：
  # 任何 PR 都跑测试与 pr-body；目标是 main 的 PR 额外跑验收与回归门禁。
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 每个 PR 都跑全量：只有全量才能发现「新功能踩坏别处」。
      # 控制 CI 成本走 docs/TEST_SCOPE.md 的整体 scope 预算，不裁剪单个 PR 的范围。
      - name: Run full suite with coverage gate
        run: |
          python -m pytest -q \
            --cov=scripts \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=74

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check diff whitespace and conflict markers
        if: github.event_name == 'pull_request'
        run: git diff --check ${{ github.event.pull_request.base.sha }}...${{ github.sha }}

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

  test_scope:
    name: test-scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check overall test scope and budget
        run: python scripts/test_scope.py --check

  pr_title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          title = os.environ.get("TITLE", "").strip()
          pattern = r"^(feat|fix|docs|refactor|test|chore|perf|build|ci|revert)(\([^)]+\))?!?: .+"
          if not re.match(pattern, title):
              print(f"::error::PR 标题不符合 Conventional Commits：{title!r}")
              print("示例：feat(results): add artifact hash verification")
              sys.exit(1)
          if len(title) > 72:
              print(f"::error::PR 标题超过 72 字符（当前 {len(title)}）")
              sys.exit(1)
          print(f"PR 标题合法：{title}")
          PY

  pr_body:
    name: pr-body
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Require requirement id and manual self-test record
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.md"
          python scripts/pr_body_guard.py --body-file "$RUNNER_TEMP/pr_body.md" --base "$BASE_REF"

  acceptance_gate:
    name: acceptance-gate
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Require an independent acceptance report
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.md"
          git fetch -q origin main
          python scripts/acceptance_gate.py \
            --body-file "$RUNNER_TEMP/pr_body.md" --base origin/main --head HEAD

  regression_gate:
    name: regression-gate
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Require a batched regression record on main
        run: |
          git fetch -q origin main
          python scripts/regression_gate.py --check --main-ref origin/main

  ci_success:
    name: ci-success
    if: always()
    needs: [test, lint, test_scope, pr_title, pr_body, acceptance_gate, regression_gate]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          echo "test=${{ needs.test.result }}"
          echo "lint=${{ needs.lint.result }}"
          echo "test-scope=${{ needs.test_scope.result }}"
          echo "pr-title=${{ needs.pr_title.result }}"
          echo "pr-body=${{ needs.pr_body.result }}"
          echo "acceptance-gate=${{ needs.acceptance_gate.result }}"
          echo "regression-gate=${{ needs.regression_gate.result }}"
          [ "${{ needs.test.result }}" = "success" ]
          [ "${{ needs.lint.result }}" = "success" ]
          [ "${{ needs.test_scope.result }}" = "success" ]
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            [ "${{ needs.pr_title.result }}" = "success" ]
            [ "${{ needs.pr_body.result }}" = "success" ]
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "main" ]; then
            [ "${{ needs.acceptance_gate.result }}" = "success" ]
            [ "${{ needs.regression_gate.result }}" = "success" ]
          fi
