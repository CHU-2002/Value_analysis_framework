name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check diff whitespace and conflict markers
        if: github.event_name == 'pull_request'
        run: git diff --check ${{ github.event.pull_request.base.sha }}...${{ github.sha }}

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          title = os.environ.get("TITLE", "").strip()
          pattern = r"^(feat|fix|docs|refactor|test|chore|perf|build|ci|revert)(\([^)]+\))?!?: .+"
          if not re.match(pattern, title):
              print(f"::error::PR 标题不符合 Conventional Commits：{title!r}")
              print("示例：feat(results): add artifact hash verification")
              sys.exit(1)
          if len(title) > 72:
              print(f"::error::PR 标题超过 72 字符（当前 {len(title)}）")
              sys.exit(1)
          print(f"PR 标题合法：{title}")
          PY

  ci-success:
    name: ci-success
    if: always()
    needs: [test, lint, pr-title]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          echo "test=${{ needs.test.result }}"
          echo "lint=${{ needs.lint.result }}"
          echo "pr-title=${{ needs.pr-title.result }}"
          [ "${{ needs.test.result }}" = "success" ]
          [ "${{ needs.lint.result }}" = "success" ]
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            [ "${{ needs.pr-title.result }}" = "success" ]
          fi
