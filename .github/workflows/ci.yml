name: CI

# 设计原则：**少 job、轻依赖、快反馈**。
#   - 只有一个干活 job（`ci`）：便宜的门禁先跑，全量测试放最后，避免每个检查各占一个
#     job 的 checkout + 装依赖开销；`ci-success` 只做汇总（分支保护只认它）。
#   - 测试只装 requirements-test.txt：比 requirements.txt 少了 notebook / 绘图层。
#   - 默认只跑 Python 3.12（与开发环境一致）；最低支持版本 3.10 用 workflow_dispatch 手动核。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python 版本（默认 3.12；填 3.10 可核最低支持版本）"
        default: "3.12"
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: ${{ inputs.python-version || '3.12' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0          # 门禁需要 base...head 与提交历史

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      # ---------- 便宜的门禁先跑：失败就不用等全量测试 ----------
      - name: Lint — compile and whitespace/conflict markers
        run: |
          python -m compileall -q scripts tests
          git diff --check
          BASE=$(git merge-base origin/main HEAD 2>/dev/null || true)
          if [ -n "$BASE" ]; then git diff --check "$BASE"..HEAD; fi

      - name: Test scope registry and budget
        run: python scripts/test_scope.py --check

      - name: PR title follows Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          title = os.environ.get("TITLE", "").strip()
          pattern = r"^(feat|fix|docs|refactor|test|chore|perf|build|ci|revert)(\([^)]+\))?!?: .+"
          if not re.match(pattern, title):
              print(f"::error::PR 标题不符合 Conventional Commits：{title!r}")
              print("示例：feat(results): add artifact hash verification")
              sys.exit(1)
          if len(title) > 72:
              print(f"::error::PR 标题超过 72 字符（当前 {len(title)}）")
              sys.exit(1)
          print(f"PR 标题合法：{title}")
          PY

      - name: PR body has the required sections
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.md"
          python scripts/pr_body_guard.py --body-file "$RUNNER_TEMP/pr_body.md" --base "$BASE_REF"

      - name: Independent acceptance report (feature branch → main)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.md"
          git fetch -q origin main
          python scripts/acceptance_gate.py \
            --body-file "$RUNNER_TEMP/pr_body.md" --base origin/main --head HEAD

      - name: Batched regression record (feature branch → main)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          git fetch -q origin main
          python scripts/regression_gate.py --check --main-ref origin/main

      # ---------- 最后跑全量：只有全量才能发现「新功能踩坏别处」 ----------
      # if: always() —— 前面的门禁失败时也跑一次，好让一次 run 就拿到测试结果
      - name: Full suite with coverage gate
        if: always()
        run: |
          python -m pytest -q -n auto \
            --cov=scripts \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=74

  ci-success:
    name: ci-success
    if: always()
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - name: Verify the ci job
        run: |
          echo "ci=${{ needs.ci.result }}"
          [ "${{ needs.ci.result }}" = "success" ]
