[pytest]
minversion = 7.0
testpaths = tests

# -ra          失败/跳过汇总，便于 CI 一眼看到未跑项
# --strict-markers  未注册的 marker 直接报错，防止拼写错误的 marker 静默失效
# --strict-config   pytest 配置项写错立即报错
addopts =
    -ra
    --strict-markers
    --strict-config

# 测试分层。分层标记由 tests/conftest.py 按文件自动附加，无需逐个测试标注：
#   pytest -m unit        只跑快层
#   pytest -m "not integration"
# 更重的层在 conftest.py 的 TEST_LAYERS 登记。策略见 docs/TESTING.md。
markers =
    unit: 单模块逻辑，无网络、无真实文件系统副作用
    contract: 契约与不变量（schema/提示词三方一致、哈希校验、原子回退）
    e2e: mock 端到端，串起多条管线
    integration: 需要真实 TUSHARE_TOKEN 或网络，未配置时跳过

# 覆盖率不写进 addopts：否则单跑一个测试文件也会因总覆盖率不足而失败。
# 覆盖率门禁由 CI 与 `make cov` / `make verify` 显式开启，见 docs/TESTING.md。
