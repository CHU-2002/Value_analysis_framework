<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>价值分析控制台</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">价值分析控制台</span>
    <!-- REQ-012.1 / AC-1：当前公司是**全局上下文**，任何页面都在，不依赖某个页面的链接传递。 -->
    <label class="company-picker" for="company-select">
      <span class="company-label">当前公司</span>
      <select id="company-select" aria-label="当前公司（可搜索、可切换、记住上次选择）">
        <option value="">加载中…</option>
      </select>
    </label>
    <span class="hint">只监听本机 · 浏览不联网 · 数据来自本地产物</span>
  </header>
  <div class="layout">
    <nav id="nav" class="sidebar" aria-label="功能导航">加载中…</nav>
    <main class="content">
      <div class="content-head">
        <div id="breadcrumb" class="breadcrumb"></div>
        <h1 id="page-title">—</h1>
        <nav id="context-nav" class="context-nav" aria-label="公司研究页签" hidden></nav>
        <div id="page-actions" class="page-actions"></div>
        <div id="page-desc" class="page-desc"></div>
        <div id="banner" class="banner" hidden></div>
      </div>
      <div id="panels" class="panels"></div>
    </main>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
